<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"><!--文字编码用utf8格式-->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>零食经线</title>
  <style>
    body {background-color: rgba(246, 253, 246, 0.899);}
    .正标题{color: rgba(10, 62, 21, 0.625);
      font-size: 40px;
      margin-left: 14px;}
    .副标题{margin-left: 14px;}
    .main-layout {
      display: flex;
      gap: 22px;}
    .menu {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap:20px;
      margin-left: 12px;
      width: 68px;
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 17px rgba(0, 0, 0, 0.08);}
    .content {
      margin-right: 15px;
      flex:1;
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 0 20px 25px;
      box-shadow: 2px 4px 18px rgba(0, 0, 0, 0.08);}
    .menu a {
      color: rgb(124, 134, 124);
      font-size: 17px;
      text-decoration: none;
      width: 66px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
      transition: 0.1s;
      box-shadow: 0 0.5px 1.5px rgba(0, 0, 0, 0.1);
      border: 1.5px solid rgba(248, 252, 248, 0.77);
      background-color: rgba(99, 120, 93, 0.07);}
    .menu a:hover {
      color: rgb(255, 255, 255);
      background-color: rgba(10, 100, 0, 0.377);
      transform: translateY(-3px);}
    .menu a.active span {
      display: none;}
    .menu a.active.home::after {
      content: "";
      display: block;
      width: 66px;
      height: 44px;
      background-image: url("home.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border-radius: 6px;
      transform: translateY(-1px);}
    .menu a.active.music::after {
      content: "";
      display: block;
      width: 66px;
      height: 44px;
      background-image: url("music.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border-radius: 6px;
      transform: translateY(-1px);}
    .menu a.active.diary::after {
      content: "";
      display: block;
      width: 66px;
      height: 44px;
      background-image: url("diary.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border-radius: 6px;
      transform: translateY(-1px);}
    .menu a.active.works::after {
      content: "";
      display: block;
      width: 66px;
      height: 44px;
      background-image: url("works.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border-radius: 6px;
      transform: translateY(-1px);}
    .menu a.active.tasks::after {
      content: "";
      display: block;
      width: 66px;
      height: 44px;
      background-image: url("tasks.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border-radius: 6px;
      transform: translateY(-1px);}
    
    .分割线 {
      border: none;
      height: 1.5px;
      background: linear-gradient(
        to right,
        rgba(40, 62, 27, 0.795),
        rgba(2, 145, 153, 0.678));
      margin: 50px 0;}
    .page {
      display: none;}
    .page.active {
      display: block;}
    #article-title,
    #article-content {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(10, 62, 50, 0.15);
      border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.55);
      padding: 12px 14px;
      font-size: 16px;
      outline: none;
      margin-bottom: 12px;}

    #article-content {
      min-height: 180px;
      resize: vertical;
      font-family: inherit;}

    #article-title:focus,
    #article-content:focus {
      border-color: rgba(10, 100, 80, 0.45);
      box-shadow: 0 0 8px rgba(10, 100, 80, 0.08);}

    #publish-btn {
      border: none;
      border-radius: 7px;
      padding: 10px 22px;
      background-color: rgba(0, 100, 0, 0.45);
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.1s;}

    #publish-btn:hover {
      background-color: rgba(0, 100, 0, 0.65);
      transform: translateY(-2px);}
    #article-list article {
      margin-top: 25px;
      padding: 18px 20px;
      border-radius: 12px;
      background-color: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(10, 62, 50, 0.08);}
    #article-list h3 {
      margin-top: 0;
      margin-bottom: 10px;
      color: rgba(10, 62, 50, 0.8);}

    #article-list p {
      margin: 0;
      line-height: 1.8;}
    .edit-btn {
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      margin-right: 10px;
      margin-bottom: 5px;
      margin-top: 15px;
      background-color: rgba(162, 113, 171, 0.23);
      color: rgba(67, 1, 85, 0.8);
      cursor: pointer;
      transition: 0.1s;}

    .edit-btn:hover {
      background-color: rgba(88, 9, 167, 0.25);}
    .delete-btn {
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      margin-bottom: 5px;
      margin-top: 15px;
      background-color: rgba(180, 80, 80, 0.15);
      color: rgba(150, 70, 70, 0.849);
      cursor: pointer;
      transition: 0.1s;}

    .delete-btn:hover {
      background-color: rgba(180, 80, 80, 0.35);}
    #article-list small {
      display: block;
      margin-bottom: 10px;
      color: rgba(10, 62, 50, 0.45);
      font-size: 13px;}

    /* 猫猫提示框的整个遮罩 */
  .message-box {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;

    justify-content: center;
    align-items: center;

    background-color: transparent;
}

/* 猫猫本体区域 */
  .cat-message {
    position: relative;

    width: 240px;
    height: 180px;

    background-image: url("cat-message.png");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
}

/* 猫猫里的文字 */
  #message-text {
    position: absolute;

    width: 125px;

    left: 50%;
    top: 72px;
    transform: translateX(-50%);

    margin: 0;

    text-align: center;
    white-space: nowrap;

    font-family: "Avenir Next", sans-serif;

    color: rgba(255, 255, 255);
    font-size: 13.5px;
    line-height: 2;
}

/* 猫猫里的“好”按钮 */
  #message-btn {
    position: absolute;

    left: 50%;
    bottom: 35px;

    transform: translateX(-50%);

    border: none;
    border-radius: 5px;

    padding: 5px 15px;

    background-color: rgba(0, 100, 0, 0.42);
    color: white;

    font-size: 15px;
    cursor: pointer;

    transition: 0.1s;
}

  #message-btn:hover {
    background-color: rgba(0, 100, 0, 0.6);
    transform: translateX(-50%) translateY(-1px);
}

  #article-image,
#work-image-input {
    display: block;
    margin-bottom: 12px;
    font-size: 14px;
}

#article-list img,
#works-list img {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: 12px;
    margin-top: 15px;
}

#works-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-top: 25px;
}

.work-image-card {
    position: relative;
}

.work-image-card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    margin-top: 0;
    cursor: zoom-in;
    transition: transform 0.15s;
}

.work-image-card img:hover {
    transform: scale(1.02);
}

.work-delete-btn {
    display: block;
    margin: 8px auto 0;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    background-color: rgba(180, 80, 80, 0.15);
    color: rgba(150, 70, 70, 0.849);
    cursor: pointer;
    transition: 0.1s;
}

.work-delete-btn:hover {
    background-color: rgba(180, 80, 80, 0.35);
}

#work-image-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2000;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background-color: rgba(0, 0, 0, 0.72);
    box-sizing: border-box;
    cursor: zoom-out;
}

#work-image-modal img {
    max-width: 92vw;
    max-height: 92vh;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 10px;
    box-shadow: 0 8px 35px rgba(0, 0, 0, 0.35);
    cursor: default;
}

#work-image-close {
    position: fixed;
    top: 18px;
    right: 20px;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    background-color: rgba(255, 255, 255, 0.85);
    color: rgba(10, 62, 50, 0.85);
    font-size: 24px;
    line-height: 40px;
    cursor: pointer;
}

  #user-box,
  #login-box {
    max-width: 360px;
    margin-top: 25px;
    padding: 20px;
    border-radius: 12px;
    background-color: rgba(255, 255, 255, 0.35);
    border: 1px solid rgba(10, 62, 50, 0.08);
}

#login-box input {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 10px;
    padding: 10px 12px;
    border: 1px solid rgba(10, 62, 50, 0.15);
    border-radius: 8px;
    background-color: rgba(255, 255, 255, 0.6);
    font-size: 15px;
    outline: none;
}

#user-box button,
#login-box button {
    border: none;
    border-radius: 6px;
    padding: 12px 18px;
    background-color: rgba(0, 100, 0, 0.45);
    color: white;
    cursor: pointer;
}

#login-message {
    margin-top: 10px;
    font-size: 14px;
}

    @media screen and (max-width: 600px) {

    .main-layout {
        flex-direction: column;
        gap: 15px;
    }

    .menu {
        width: auto;
        margin-left: 0;
        padding: 10px;
        flex-direction: row;
        justify-content: center;
        gap: 8px;
    }

    .menu a {
        width: 58px;
        height: 42px;
        font-size: 14px;
    }

    .menu a.active.home::after,
    .menu a.active.music::after,
    .menu a.active.diary::after,
    .menu a.active.works::after,
    .menu a.active.tasks::after {
        width: 58px;
        height: 42px;
    }

    .content {
        margin-right: 0;
        padding: 0 14px 20px;
    }

    .正标题 {
        font-size: 32px;
    }

    .副标题 {
        font-size: 14px;
    }

    .分割线 {
        margin: 30px 0;
    }

    #article-title,
    #article-content {
        font-size: 16px;
    }

    #login-box,
    #user-box {
        max-width: none;
        width: auto;
    }

}

  </style>
</head>

<body>
  <h1 class="正标题">零食经线</h1>
  <p class="副标题">碎碎念大窝</p>
  <hr class="分割线">

  <div class="main-layout">
    <div class="menu">
      <a href="#home" class="home">
        <span>首页</span>
      </a>
      <a href="#music" class="music">
        <span>录音机</span>
      </a>
      <a href="#works" class="works">
        <span>储物间</span>
      </a>
      <a href="#diary" class="diary">
        <span>日记本</span>
      </a>
      <a href="#tasks" class="tasks">
        <span>备忘录</span>
      </a>
    </div>
    <div class="content">
      <section id="home" class="page active">
          <h2>首页</h2>
          <p>欢迎来到零食经线。</p>
          <div id="login-box">
    <h3>登录零食经线</h3>

    <input
        id="login-password"
        type="password"
        placeholder="请输入密码"
    >

      <button id="login-btn">登录</button>

      <p id="login-message"></p>
      </div>

  
    <div id="user-box" style="display: none;">
    <p>已登录。</p>
    <button id="logout-btn">退出登录</button>
    </div>
         
      </section>
      <section id="music" class="page">
          <h2>录音机</h2>
          <p>这里以后放喜欢的音乐。</p>
      </section>
      <section id="works" class="page">
      <h2>储物间</h2>

      <div id="works-upload-box">
        <input
            id="work-image-input"
            type="file"
            accept="image/*"
            multiple
        >

        <button id="upload-work-btn">
            上传作品照片
        </button>

        <p id="work-upload-message"></p>
      </div>

      <div id="works-list"></div>
      </section>

      <section id="diary" class="page">
      <h2>日记本</h2>

      <input
        id="article-title"
        type="text"
        placeholder="标题"
    >

      <textarea
        id="article-content"
        placeholder="写点什么……"
    ></textarea>

      <input
        id="article-image"
        type="file"
        accept="image/*"
    >

      <button id="publish-btn">发布</button>

      <div id="article-list"></div>
      </section>

      <section id="tasks" class="page">
          <h2>备忘录</h2>
          <p>这里以后放我的任务。</p>
      </section>
    </div>
  </div>

  <div id="message-box" class="message-box">
    <div class="cat-message">
        <p id="message-text"></p>
        <button id="message-btn">好</button>
    </div>
  </div>

  <div id="work-image-modal">
    <button id="work-image-close" type="button" aria-label="关闭">×</button>
    <img id="work-image-preview" src="" alt="原图预览">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL = 'https://zcaunceikzbpaqqjtido.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Tlv_4AXjzi-ZOe0Vxr1cLQ_9CSfoM8D';

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    let editingId = null;
    let editingImagePath = null;
    let isEditor = false;

    const links = document.querySelectorAll('.menu a');
    const pages = document.querySelectorAll('.page');

    const titleInput = document.querySelector('#article-title');
    const contentInput = document.querySelector('#article-content');
    const publishButton = document.querySelector('#publish-btn');
    const articleList = document.querySelector('#article-list');

    const STORAGE_BUCKET = 'site-images';

    const articleImageInput = document.querySelector('#article-image');
    const workImageInput = document.querySelector('#work-image-input');
    const uploadWorkButton = document.querySelector('#upload-work-btn');
    const worksList = document.querySelector('#works-list');
    const worksUploadBox = document.querySelector('#works-upload-box');

    const workImageModal = document.querySelector('#work-image-modal');
    const workImagePreview = document.querySelector('#work-image-preview');
    const workImageClose = document.querySelector('#work-image-close');

    let articles = [];


    // =========================
    // 猫猫提示框
    // =========================

    const messageBox = document.querySelector('#message-box');
    const messageText = document.querySelector('#message-text');
    const messageButton = document.querySelector('#message-btn');

    function showMessage(message) {
        messageText.textContent = message;
        messageBox.style.display = 'flex';
    }

    messageButton.addEventListener('click', function() {
        messageBox.style.display = 'none';
    });

    function openWorkImage(url) {
        workImagePreview.src = url;
        workImageModal.style.display = 'flex';
    }

    function closeWorkImage() {
        workImageModal.style.display = 'none';
        workImagePreview.src = '';
    }

    workImageClose.addEventListener('click', function(event) {
        event.stopPropagation();
        closeWorkImage();
    });

    workImageModal.addEventListener('click', function(event) {
        if (event.target === workImageModal) {
            closeWorkImage();
        }
    });

    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            closeWorkImage();
        }
    });


    // =========================
    // 图片：上传到 Supabase Storage
    // =========================

    async function uploadImage(file, folder) {

        if (!file) {
            return null;
        }

        const safeName = file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            '_'
        );

        const filePath = `${folder}/${Date.now()}-${safeName}`;

        const { error } = await supabaseClient
            .storage
            .from(STORAGE_BUCKET)
            .upload(
                filePath,
                file,
                {
                    cacheControl: '3600',
                    upsert: false,
                    contentType: file.type
                }
            );

        if (error) {
            console.error('上传图片失败：', error);
            showMessage('图片上传失败了');
            return null;
        }

        return filePath;
    }


    // =========================
    // 文章：从 Supabase 读取
    // =========================

    async function loadArticles() {

        const { data, error } = await supabaseClient
            .from('articles')
            .select('*')
            .order('id', { ascending: false });

        if (error) {
            console.error('读取文章失败：', error);
            showMessage('读取文章失败了');
            return;
        }

        articles = data || [];
        await renderArticles();
    }


    // =========================
    // 文章：显示
    // =========================

    async function renderArticles() {

        articleList.innerHTML = '';

        for (const article of articles) {

            const articleElement = document.createElement('article');

            const titleElement = document.createElement('h3');
            titleElement.textContent = article.title;

            const dateElement = document.createElement('small');
            dateElement.textContent = article.date || '';

            const contentElement = document.createElement('p');
            contentElement.textContent = article.content;

            let editButton = null;
            let deleteButton = null;


            // =========================
            // 编辑者按钮
            // =========================

            if (isEditor) {

                editButton = document.createElement('button');
                editButton.textContent = '修改';
                editButton.classList.add('edit-btn');

                editButton.addEventListener('click', function() {

                    titleInput.value = article.title;
                    contentInput.value = article.content;

                    editingId = article.id;
                    editingImagePath = article.image_path || null;

                    articleImageInput.value = '';
                    publishButton.textContent = '保存修改';
                });


                deleteButton = document.createElement('button');
                deleteButton.textContent = '删除';
                deleteButton.classList.add('delete-btn');

                deleteButton.addEventListener('click', async function() {

                    const { error } = await supabaseClient
                        .from('articles')
                        .delete()
                        .eq('id', article.id);

                    if (error) {
                        console.error('删除文章失败：', error);
                        showMessage('删除失败了');
                        return;
                    }

                    if (article.image_path) {

                        const { error: imageError } = await supabaseClient
                            .storage
                            .from(STORAGE_BUCKET)
                            .remove([article.image_path]);

                        if (imageError) {
                            console.error('删除文章图片失败：', imageError);
                        }
                    }

                    await loadArticles();
                    showMessage('完成了');
                });
            }


            // =========================
            // 文章内容
            // =========================

            articleElement.appendChild(titleElement);
            articleElement.appendChild(dateElement);
            articleElement.appendChild(contentElement);


            // =========================
            // 日记照片
            // =========================

            if (article.image_path) {

                const { data, error } = await supabaseClient
                    .storage
                    .from(STORAGE_BUCKET)
                    .createSignedUrl(article.image_path, 3600);

                if (!error && data?.signedUrl) {

                    const imageElement = document.createElement('img');
                    imageElement.src = data.signedUrl;
                    imageElement.alt = '日记照片';

                    articleElement.appendChild(imageElement);
                }
            }


            // =========================
            // 按钮放在文章下面
            // =========================

            if (isEditor) {
                articleElement.appendChild(editButton);
                articleElement.appendChild(deleteButton);
            }

            articleList.appendChild(articleElement);
        }
    }


    // =========================
    // 编辑者界面
    // =========================

    function updateEditorUI() {

        if (isEditor) {

            titleInput.style.display = 'block';
            contentInput.style.display = 'block';
            publishButton.style.display = 'inline-block';

            articleImageInput.style.display = 'block';
            worksUploadBox.style.display = 'block';

        } else {

            titleInput.style.display = 'none';
            contentInput.style.display = 'none';
            publishButton.style.display = 'none';

            articleImageInput.style.display = 'none';
            worksUploadBox.style.display = 'none';
        }
    }


    // =========================
    // 发布 / 修改日记
    // =========================

    publishButton.addEventListener('click', async function() {

        const title = titleInput.value.trim();
        const content = contentInput.value.trim();

        if (!title || !content) {
            showMessage('不能为空哦！');
            return;
        }


        // =========================
        // 修改已有文章
        // =========================

        if (editingId !== null) {

            let newImagePath = editingImagePath;
            const selectedFile = articleImageInput.files[0];

            if (selectedFile) {

                newImagePath = await uploadImage(
                    selectedFile,
                    'diary'
                );

                if (!newImagePath) {
                    return;
                }
            }

            const { error } = await supabaseClient
                .from('articles')
                .update({
                    title: title,
                    content: content,
                    image_path: newImagePath
                })
                .eq('id', editingId);

            if (error) {
                console.error('修改文章失败：', error);
                showMessage('修改失败了');
                return;
            }

            if (
                editingImagePath &&
                editingImagePath !== newImagePath
            ) {

                const { error: imageError } = await supabaseClient
                    .storage
                    .from(STORAGE_BUCKET)
                    .remove([editingImagePath]);

                if (imageError) {
                    console.error('删除旧图片失败：', imageError);
                }
            }

            await loadArticles();

            titleInput.value = '';
            contentInput.value = '';
            articleImageInput.value = '';

            editingId = null;
            editingImagePath = null;

            publishButton.textContent = '发布';

            showMessage('修改好了(>^ω^<)');
            return;
        }


        // =========================
        // 发布新文章
        // =========================

        let imagePath = null;
        const selectedFile = articleImageInput.files[0];

        if (selectedFile) {

            imagePath = await uploadImage(
                selectedFile,
                'diary'
            );

            if (!imagePath) {
                return;
            }
        }

        const article = {
            title: title,
            content: content,
            date: new Date().toLocaleString(),
            image_path: imagePath
        };

        const { error } = await supabaseClient
            .from('articles')
            .insert([article]);

        if (error) {
            console.error('发布文章失败：', error);
            showMessage('发布失败了');
            return;
        }

        await loadArticles();

        titleInput.value = '';
        contentInput.value = '';
        articleImageInput.value = '';

        showMessage('收到(>^ω^<)');
    });


    // =========================
    // 页面导航
    // =========================

    links.forEach(link => {

        link.addEventListener('click', async function(event) {

            event.preventDefault();

            const targetId = link.getAttribute('href');

            const { data } = await supabaseClient.auth.getSession();
            const session = data.session;

            if (targetId === '#diary' && !session) {
                showMessage('未登录！');
                return;
            }

            links.forEach(item => {
                item.classList.remove('active');
            });

            link.classList.add('active');

            pages.forEach(page => {
                page.classList.remove('active');
            });

            document.querySelector(targetId).classList.add('active');
        });
    });


    // =========================
    // 登录相关
    // =========================

    const loginBox = document.querySelector('#login-box');
    const userBox = document.querySelector('#user-box');

    const loginPassword = document.querySelector('#login-password');
    const loginButton = document.querySelector('#login-btn');
    const loginMessage = document.querySelector('#login-message');
    const logoutButton = document.querySelector('#logout-btn');

    const EDITOR_EMAIL = 'gg200812@icloud.com';
    const VIEWER_EMAIL = '126091097@link.cuhk.edu.cn';

    loginPassword.addEventListener('input', function() {
        loginMessage.textContent = '';
    });


    loginButton.addEventListener('click', async function() {

        const password = loginPassword.value;

        if (!password) {
            loginMessage.textContent = '请输入密码哦。';
            return;
        }

        let result = await supabaseClient.auth.signInWithPassword({
            email: EDITOR_EMAIL,
            password: password
        });

        if (result.error) {
            result = await supabaseClient.auth.signInWithPassword({
                email: VIEWER_EMAIL,
                password: password
            });
        }

        if (result.error) {
            loginMessage.textContent = '登录失败';
            return;
        }

        const user = result.data.user;
        isEditor = user.email === EDITOR_EMAIL;

        loginMessage.textContent = '';
        loginPassword.value = '';

        loginBox.style.display = 'none';
        userBox.style.display = 'block';

        updateEditorUI();

        await loadArticles();
        await loadWorksImages();
    });


    logoutButton.addEventListener('click', async function() {

        await supabaseClient.auth.signOut();

        loginMessage.textContent = '';
        loginPassword.value = '';

        loginBox.style.display = 'block';
        userBox.style.display = 'none';

        isEditor = false;
        updateEditorUI();

        articles = [];
        await renderArticles();

        worksList.innerHTML = '';

        editingId = null;
        editingImagePath = null;

        titleInput.value = '';
        contentInput.value = '';
        articleImageInput.value = '';

        publishButton.textContent = '发布';
    });


    // =========================
    // 作品照片上传
    // =========================

    uploadWorkButton.addEventListener('click', async function() {

        const files = Array.from(workImageInput.files);

        if (files.length === 0) {
            showMessage('请先选择照片哦！');
            return;
        }

        for (const file of files) {

            const imagePath = await uploadImage(file, 'works');

            if (!imagePath) {
                return;
            }
        }

        workImageInput.value = '';

        showMessage('作品照片上传好了');

        await loadWorksImages();
    });


    // =========================
    // 作品照片读取
    // =========================

    async function loadWorksImages() {

        worksList.innerHTML = '';

        const { data, error } = await supabaseClient
            .storage
            .from(STORAGE_BUCKET)
            .list('works', {
                limit: 100,
                sortBy: {
                    column: 'name',
                    order: 'desc'
                }
            });

        if (error) {
            console.error('读取作品照片失败：', error);
            return;
        }

        for (const file of data || []) {

            if (!file.name) {
                continue;
            }

            const path = `works/${file.name}`;

            const { data: signedData, error: signedError } =
                await supabaseClient
                    .storage
                    .from(STORAGE_BUCKET)
                    .createSignedUrl(path, 3600);

            if (signedError || !signedData?.signedUrl) {
                continue;
            }

            const card = document.createElement('div');
            card.classList.add('work-image-card');

            const image = document.createElement('img');
            image.src = signedData.signedUrl;
            image.alt = '作品';
            image.addEventListener('click', function() {
                openWorkImage(signedData.signedUrl);
            });

            card.appendChild(image);

            if (isEditor) {
                const deleteButton = document.createElement('button');
                deleteButton.type = 'button';
                deleteButton.textContent = '删除';
                deleteButton.classList.add('work-delete-btn');

                deleteButton.addEventListener('click', async function(event) {
                    event.stopPropagation();

                    const shouldDelete = window.confirm('确定要删除这张作品照片吗？');
                    if (!shouldDelete) {
                        return;
                    }

                    const { error: deleteError } = await supabaseClient
                        .storage
                        .from(STORAGE_BUCKET)
                        .remove([path]);

                    if (deleteError) {
                        console.error('删除作品照片失败：', deleteError);
                        showMessage('删除失败了');
                        return;
                    }

                    showMessage('删除好了');
                    await loadWorksImages();
                });

                card.appendChild(deleteButton);
            }

            worksList.appendChild(card);
        }
    }


    // =========================
    // 检查当前登录状态
    // =========================

    async function updateLoginUI() {

        const { data } = await supabaseClient.auth.getSession();
        const session = data.session;

        if (session) {

            loginBox.style.display = 'none';
            userBox.style.display = 'block';

            isEditor = session.user.email === EDITOR_EMAIL;
            updateEditorUI();

            await loadArticles();
            await loadWorksImages();

        } else {

            loginBox.style.display = 'block';
            userBox.style.display = 'none';

            isEditor = false;
            updateEditorUI();

            articles = [];
            await renderArticles();
            worksList.innerHTML = '';
        }
    }

    updateLoginUI();
  </script>
</body>
</html>
